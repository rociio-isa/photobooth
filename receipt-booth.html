<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Receipt Booth</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#1c1a17;--paper:#fff;--accent:#c2274b;--muted:#6f6a60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--ink:#f3efe6;--paper:#2a2723;--muted:#a39d90}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Courier Prime","Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;overflow:hidden;-webkit-user-select:none;user-select:none}
.screen{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:520px;height:100%;justify-content:center}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:-.02em;text-align:center}
p{margin:0;color:var(--muted);text-align:center;font-size:16px}
button{font:inherit;font-weight:700;font-size:20px;border:2px solid var(--ink);background:var(--accent);color:#fff;padding:16px 28px;border-radius:999px;cursor:pointer;min-height:56px}
button.alt{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.cam{position:relative;width:min(100%,60vh);aspect-ratio:1;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:grayscale(1) contrast(1.2)}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30vh;font-weight:700;color:#fff;text-shadow:0 0 24px rgba(0,0,0,.6)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%}.dots i.f{background:var(--accent);border-color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#prev{max-height:62vh;max-width:100%;background:#fff;border:1px solid var(--muted);box-shadow:0 6px 18px rgba(0,0,0,.25);animation:out .9s ease-out}
@keyframes out{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@media (prefers-reduced-motion:reduce){#prev{animation:none}}
.wrap{overflow-y:auto;max-height:64vh;max-width:100%}
#cfg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;font-size:14px;padding:8px 12px;min-height:40px;opacity:.5}
#pa{display:none}
@media print{@page{margin:0;size:80mm auto}body>*:not(#pa){display:none!important}#pa{display:block}#pa img{width:80mm;display:block}}
</style>
</head>
<body>
<button id="cfg" class="alt" aria-label="Edit booth name">Edit name</button>

<section class="screen on" id="s0">
  <h1 id="title">Four Strips Booth</h1>
  <p>Tap to take 4 photos. Your receipt prints right after.</p>
  <button id="go">Touch to start</button>
  <p id="err" style="color:var(--accent)"></p>
</section>

<section class="screen" id="s1">
  <div class="cam"><video id="v" playsinline muted autoplay></video><div id="count"></div><div id="flash"></div></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <p id="msg">Get ready</p>
</section>

<section class="screen" id="s2">
  <div class="wrap"><img id="prev" alt="Your photo strip"></div>
  <div class="row"><button id="print">Print strip</button><button class="alt" id="save">Save image</button><button class="alt" id="again">New strip</button></div>
</section>

<div id="pa"><img id="pimg" alt=""></div>
<canvas id="c" width="520" height="520" hidden></canvas>

<script>
const $=id=>document.getElementById(id);
let name="Four Strips Booth",stream=null,shots=[];
try{const n=localStorage.getItem("booth-name");if(n){name=n;$("title").textContent=n}}catch(e){}
const show=n=>[0,1,2].forEach(i=>$("s"+i).classList.toggle("on",i===n));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

$("cfg").onclick=()=>{const n=prompt("Booth name (printed on every strip):",name);if(n){name=n.slice(0,28);$("title").textContent=name;try{localStorage.setItem("booth-name",name)}catch(e){}}};

async function cam(){
  if(stream)return;
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:960}},audio:false});
  $("v").srcObject=stream;await $("v").play();
}

// Bayer 4x4 dither: turns a photo into the crisp black-and-white dots a thermal printer makes.
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function grab(){
  const c=$("c"),x=c.getContext("2d"),v=$("v"),s=Math.min(v.videoWidth,v.videoHeight);
  x.save();x.translate(520,0);x.scale(-1,1);
  x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,520,520);x.restore();
  const d=x.getImageData(0,0,520,520),p=d.data;
  for(let i=0;i<p.length;i+=4){
    const px=(i/4)%520,py=Math.floor(i/4/520);
    let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];
    g=Math.max(0,Math.min(255,(g-128)*1.25+135));
    const t=(B[(py%4)*4+px%4]+.5)*16;
    const o=g>t?255:0;p[i]=p[i+1]=p[i+2]=o;
  }
  x.putImageData(d,0,0);
  const k=document.createElement("canvas");k.width=k.height=520;k.getContext("2d").drawImage(c,0,0);return k;
}

function strip(){
  const W=576,pad=28,ph=520,gap=22,head=150,foot=250;
  const H=head+shots.length*(ph+gap)+foot,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.textAlign="center";
  x.font="bold 44px 'Courier Prime','Courier New',monospace";x.fillText(name.toUpperCase(),W/2,70);
  x.font="22px 'Courier Prime','Courier New',monospace";
  const dt=new Date();x.fillText(dt.toLocaleDateString()+"  "+dt.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),W/2,104);
  x.fillText("*".repeat(32),W/2,134);
  shots.forEach((s,i)=>{x.drawImage(s,(W-ph)/2+0,head+i*(ph+gap),ph,ph)});
  let y=head+shots.length*(ph+gap)+10;
  x.fillText("*".repeat(32),W/2,y);
  // decorative barcode
  let bx=pad+20;const by=y+24,bh=80;
  while(bx<W-pad-20){const bw=1+Math.floor(Math.random()*5);x.fillRect(bx,by,bw,bh);bx+=bw+1+Math.floor(Math.random()*4)}
  x.font="bold 26px 'Courier Prime','Courier New',monospace";
  x.fillText("THANKS FOR HAVING FUN WITH US!",W/2,by+bh+44);
  return c;
}

$("go").onclick=async()=>{
  $("err").textContent="";
  try{await cam()}catch(e){$("err").textContent="Camera blocked. Allow camera access for this page in Safari settings, then try again.";return}
  show(1);run();
};

async function run(){
  shots=[];[...$("dots").children].forEach(d=>d.className="");
  for(let i=0;i<4;i++){
    $("msg").textContent="Photo "+(i+1)+" of 4";
    for(let n=3;n>0;n--){$("count").textContent=n;await wait(1000)}
    $("count").textContent="";
    $("flash").style.opacity=.9;shots.push(grab());await wait(150);$("flash").style.opacity=0;
    $("dots").children[i].className="f";await wait(700);
  }
  const s=strip(),url=s.toDataURL("image/png");
  $("prev").src=url;$("pimg").src=url;show(2);
}

$("print").onclick=()=>window.print();
$("save").onclick=()=>{const a=document.createElement("a");a.href=$("prev").src;a.download="strip-"+Date.now()+".png";a.click()};
$("again").onclick=()=>{show(1);run()};
</script>
</body>
</html>
